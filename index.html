<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Bike Tour at Klong Bang Mot</title>
    <link href="https://fonts.googleapis.com/css2?family=Athiti:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #1d2b3a; font-family: Athiti, system-ui, sans-serif; color: #4a3322; overflow: hidden; }
      #wrap { position: relative; margin: 0 auto; height: 100%; max-width: calc(100vh * 2 / 3); aspect-ratio: 2/3; max-height: 100vh; }
      @media (max-aspect-ratio: 2/3) { #wrap { width: 100%; height: auto; max-width: none; top: 50%; transform: translateY(-50%); } }
      svg#map { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; background: transparent; }
      #mapbg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; background: #bfe8a0; }
      .pill { position: absolute; background: #fffffff0; border: 3px solid #4a3322; border-radius: 16px; padding: 4px 12px; font-weight: 700; font-size: 20px; }
      #coins { left: 10px; top: 10px; }
      #stamps { right: 10px; top: 10px; }
      button { font: inherit; font-weight: 700; font-size: 20px; color: #fff; background: #ff9a2e; border: 3px solid #4a3322; border-bottom-width: 6px; border-radius: 18px; padding: 8px 22px; cursor: pointer; }
      button:active { transform: translateY(2px); border-bottom-width: 4px; }
      button.alt { background: #2a8fc0; }
      button:disabled { background: #bbb; color: #eee; cursor: default; }
      .node { cursor: pointer; }
      .node text.lb { font-weight: 700; font-size: 17px; fill: #4a3322; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; text-anchor: middle; }
      .ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #1d2b3acc; border-radius: 18px; z-index: 5; padding: 14px; }
      .ov.off { display: none; }
      .card { background: #fffdf3; border: 4px solid #7a5230; border-radius: 22px; padding: 16px 16px 18px; width: 100%; text-align: center; box-shadow: 0 6px 0 #00000030; max-height: 94%; overflow: auto; }
      .card h1 { margin: 0 0 6px; font-size: 28px; color: #c2521a; }
      .card p { margin: 6px 0; font-size: 18px; }
      .up { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border: 3px solid #e3cfa8; border-radius: 16px; padding: 8px 10px; margin: 8px 0; }
      .up .ic { font-size: 34px; }
      .up .tx { flex: 1; font-size: 16px; line-height: 1.15; }
      .up .tx b { font-size: 18px; }
      .dots { letter-spacing: 3px; color: #ff9a2e; }
      .up button { font-size: 16px; padding: 6px 12px; }
      #game { position: absolute; inset: 0; z-index: 6; border-radius: 18px; overflow: hidden; background: #000; }
      #game.off { display: none; }
      #game iframe { width: 100%; height: 100%; border: 0; display: block; }
      #rider { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
      #bar, #vbar { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; gap: 10px; justify-content: center; z-index: 2; }
      .sw { display: inline-block; width: 22px; height: 22px; border-radius: 50%; border: 3px solid #4a3322; vertical-align: middle; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 3px solid #e3cfa8; border-radius: 14px; padding: 4px 8px; margin: 6px 0; font-size: 18px; font-weight: 700; }
      .row button { font-size: 16px; padding: 2px 12px; border-bottom-width: 4px; }
      .pre { display: flex; gap: 4px; justify-content: center; margin: 6px 0; flex-wrap: wrap; }
      .pre canvas { width: 54px; height: 62px; border: 3px solid #e3cfa8; border-radius: 12px; background: #fff; cursor: pointer; }
      .pre canvas.sel { border-color: #ff9a2e; background: #fff3dc; }
      #setbtn { position: absolute; left: 10px; top: 58px; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: #fffd; border: 3px solid #4a3322; border-bottom-width: 6px; box-shadow: none; display: flex; align-items: center; justify-content: center; z-index: 3; }
      #setbtn svg { width: 24px; height: 24px; fill: #5b4630; transition: transform 0.4s; }
      #setbtn:hover svg { transform: rotate(60deg); }
      button.red { background: #e8553a; }
      #zoom { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 3; }
      #zoom button { width: 42px; height: 42px; padding: 0; border-radius: 50%; font-size: 26px; line-height: 1; background: #fffffff0; color: #4a3322; border: 3px solid #4a3322; border-bottom-width: 5px; box-shadow: none; }
      #wrap { touch-action: none; }
      #toast { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); background: #fff8d6; border: 3px solid #4a3322; border-radius: 14px; padding: 6px 16px; font-weight: 700; font-size: 18px; z-index: 4; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
      #toast.on { opacity: 1; }
      #hint { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: #fff8d6; border: 3px solid #4a3322; border-radius: 16px; padding: 6px 14px; font-weight: 700; font-size: 17px; line-height: 1.2; text-align: center; z-index: 3; pointer-events: none; opacity: 0; transition: opacity 0.3s; width: max-content; max-width: 90%; animation: hb 1.4s ease-in-out infinite; }
      #hint.on { opacity: 1; }
      @keyframes hb { 0%, 100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 5px); } }
      #say { position: absolute; left: 14px; right: 14px; bottom: 92px; background: #fffdf3; border: 4px solid #7a5230; border-radius: 18px; padding: 8px 14px; font-size: 17px; line-height: 1.25; z-index: 4; opacity: 0; transition: opacity 0.25s; text-align: center; cursor: pointer; pointer-events: none; }
      #say.on { pointer-events: auto; }
      #say b { color: #c2521a; font-size: 19px; }
      #say.on { opacity: 1; }
      #stamps { cursor: pointer; }
      .fact { background: #e9f6ff; border: 3px solid #9ed3f0; border-radius: 14px; padding: 8px 10px; margin: 8px 0; font-size: 16px; line-height: 1.25; text-align: left; }
      .fact b { color: #1f6e9a; }
      .stars { display: inline-flex; gap: 2px; vertical-align: middle; }
      /* ---- village multiplayer UI ---- */
      /* portrait phones: the village fills the whole screen (the camera just shows more map) */
      @media (max-aspect-ratio: 2/3) { #wrap.full { top: 0; transform: none; height: 100%; aspect-ratio: auto; } }
      #wrap.full #zoom { top: 58px; transform: none; }
      #vbar button { white-space: nowrap; font-size: 18px; padding: 7px 16px; }
      #online { left: 60px; top: 63px; font-size: 15px; padding: 3px 10px; white-space: nowrap; display: none; cursor: default; }
      #online i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #bbb; margin-right: 5px; vertical-align: 0; border: 2px solid #4a3322; }
      #online.on i { background: #3ccf6a; }
      #online.wait i { background: #ffc82e; }
      #vtools { position: absolute; right: 10px; bottom: 86px; display: none; flex-direction: column; gap: 10px; z-index: 3; }
      #vtools button { width: 54px; height: 54px; padding: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #fffffff0; border: 3px solid #4a3322; border-bottom-width: 6px; }
      #vtools svg { width: 28px; height: 28px; }
      #micbtn.on { background: #3ccf6a; }
      #micbtn.on svg path { fill: #fff; }
      #micbtn .slash { display: block; }
      #micbtn.on .slash { display: none; }
      #chatbar { position: absolute; left: 10px; right: 10px; top: 56px; display: none; gap: 6px; z-index: 7; }
      #chatbar.on { display: flex; }
      #chatbar input { flex: 1; min-width: 0; font: inherit; font-size: 18px; font-weight: 600; padding: 6px 12px; border: 3px solid #4a3322; border-radius: 16px; color: #4a3322; background: #fff; outline: none; }
      #chatbar button { font-size: 17px; padding: 4px 14px; border-bottom-width: 5px; }
      #chatlog { position: absolute; left: 10px; bottom: 86px; max-width: calc(100% - 90px); display: flex; flex-direction: column; gap: 4px; z-index: 3; pointer-events: none; }
      #chatlog div { background: #fffdf3e6; border: 2px solid #7a5230; border-radius: 12px; padding: 2px 10px; font-size: 15px; line-height: 1.25; transition: opacity 0.6s; overflow-wrap: anywhere; }
      #chatlog b { color: #2a6f9a; }
      #chatlog .me b { color: #c2521a; }
      #chatlog .old { opacity: 0; }
      #stick { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; background: #ffffff55; border: 3px solid #ffffffcc; box-shadow: 0 0 0 3px #4a332255; z-index: 3; pointer-events: none; display: none; }
      #stick b { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: #fffdf3; border: 3px solid #4a3322; box-shadow: 0 3px 0 #00000030; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="mapbg"></canvas>
      <svg id="map" viewBox="0 0 420 630" preserveAspectRatio="xMidYMid slice">
        <path id="river" d="M-20,520 C90,470 120,600 230,540 S400,380 300,300 S120,330 170,200 S330,160 250,60 L250,-20" fill="none" stroke="none" />
        <path id="road2" d="M72,545 C130,590 230,610 340,520 S380,380 250,340 S90,380 120,270 S330,250 300,170 S170,150 205,108" fill="none" stroke="none" />
        <g id="nodes"></g>
      </svg>
      <canvas id="rider"></canvas>
      <div class="pill" id="coins" style="font-size:17px;padding:4px 10px"></div>
      <div class="pill" id="stamps"></div>
      <button id="setbtn" title="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
      <div id="hint">แตะวงกลมสีเพื่อเล่น</div>
      <div id="toast"></div>
      <div id="fade" style="position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .4s;z-index:9;border-radius:18px"></div>
      <div id="say"></div>
      <div id="bar"><button id="charbtn"></button><button id="shopbtn" class="alt"></button></div>
      <div id="zoom" style="display:none"><button id="zhelp" style="font-size:22px">?</button><button id="zin">+</button><button id="zout">&minus;</button></div>
      <div id="vbar" style="display:none"><button id="vback"></button><button id="vsum" class="alt"></button></div>
      <div class="pill" id="online"><i></i><span></span></div>
      <div id="chatlog"></div>
      <div id="stick"><b></b></div>
      <div id="vtools">
        <button id="chatbtn" title="แชต"><svg viewBox="0 0 24 24"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#5b4630"/></svg></button>
        <button id="micbtn" title="ไมค์"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9z" fill="#5b4630"/><path class="slash" d="M4 3l17 17" stroke="#e8553a" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      </div>
      <form id="chatbar" autocomplete="off"><input id="chatin" maxlength="100" placeholder="พิมพ์ข้อความ…" enterkeyhint="send" /><button type="submit">ส่ง</button></form>
      <div class="ov off" id="ov"><div class="card" id="card"></div></div>
      <div id="game" class="off"></div>
    </div>
    <script src="icons.js"></script>
    <script src="char.js"></script>
    <script src="art.js"></script>
    <script src="mapart.js"></script>
    <script src="village.js"></script>
    <script src="voice.js"></script>
    <script src="net.js"></script>
    <script>
      const GAMES = {
        fish: { name: "ท่าตกปลา", ic: "fish", at: 0.3, coin: 1, url: (u) => "play/index.html?g=fish&up=" + u + "&c=" + encodeURIComponent(JSON.stringify(S.char)) },
        fruit: { name: "สวนส้ม", ic: "orange", at: 0.62, coin: 2, url: (u) => "play/index.html?g=fruit&up=" + u },
        noodle: { name: "ตลาดเรือ", ic: "bowl", at: 0.9, coin: 1, url: (u) => "noodle/index.html?up=" + u },
      };
      const SHOP = [
        { k: "fish", ic: "rod", n: "คันเบ็ดไม้ไผ่", d: "เวลาตกปลา +5 วินาที · คันเบ็ดและท่าน้ำสวยขึ้น" },
        { k: "fruit", ic: "basket", n: "ตะกร้าสานของป้า", d: "เวลาเก็บส้ม +5 วินาที · ตะกร้าสวยขึ้น" },
        { k: "noodle", ic: "pot", n: "หม้อน้ำซุปประจำเรือ", d: "ลูกค้ารอนานขึ้น 20% · หม้อน้ำซุปสวยขึ้น" },
      ];
      const COST = [15, 30, 45];
      const SOUV = { fish: { n: "ผักสวนครัวริมคลอง", ic: "veg" }, fruit: { n: "ส้มเขียวหวานบางมด", ic: "orange" }, noodle: { n: "ก๋วยเตี๋ยวเรือ", ic: "bowl" } };
      const TH = { fish: [8, 16, 28], fruit: [8, 15, 25], noodle: [8, 16, 28] };
      const TIERN = ["", "ตราไม้ไผ่", "ตราเงิน", "ตราทอง"];
      const tierOf = (k, sc) => TH[k].filter((t) => sc >= t).length;
      const FACTS = {
        fish: [
          "คนรุ่นก่อนมีคลองเป็นทุกสิ่ง ทั้งเส้นทางสัญจร แหล่งอาหาร และเส้นทางขนส่งสินค้า",
          "สองฝั่งคลองบางมดมีทั้งวัด มัสยิด ศาลเจ้า และสวนส้ม คนหลายศาสนาอยู่ร่วมกันมานาน",
          "คนริมคลองใช้เรือไปรดน้ำสวน ขนผลไม้ไปขาย และไปซื้อของที่ตลาด",
        ],
        fruit: [
          "ส้มเขียวหวานบางมดเคยเป็นแบรนด์ส้มชื่อดัง เริ่มจากชาวสวนที่ย้ายมาจากย่านบางช้างและดำเนินสะดวก",
          "สวนที่นี่ปลูกบนท้องร่อง มีน้ำล้อมรอบ ต้องใช้เรือเข้าไปรดน้ำและขนผลผลิตออกมา",
          "เมื่อสวนส้มทยอยล้ม ชาวสวนหลายคนปลูกไม้ผลอื่นแซม เช่น มะพร้าวน้ำหอม ลิ้นจี่ ชมพู่ มะม่วง ส้มโอ",
        ],
        noodle: [
          "เรือเป็นทั้งพาหนะและเครื่องมือทำมาหากินของคนคลอง ผลผลิตจากสวนออกสู่ตลาดด้วยเรือ",
          "คนในย่านคลองพายเรือไปซื้ออาหารและของใช้ที่ตลาดวัดไทร",
          "ริมคลองมีทั้งบ้านเรือน ต้นมะพร้าว และสวน ชีวิตที่นี่ค่อยๆ เดินไปตามจังหวะของสายน้ำ",
        ],
      };
      const SAY = {
        aunty: ["ป้าสวนส้ม", ["สวัสดีจ้ะ มาเก็บส้มด้วยกันไหม", "ส้มบางมดปลูกบนท้องร่อง มีน้ำล้อมรอบ ต้องพายเรือเข้าไปรดน้ำเลยนะลูก", "สมัยก่อนส้มบางมดดังมาก ตอนนี้สวนหลายแห่งปลูกมะพร้าว ลิ้นจี่ ชมพู่แซมด้วยจ้ะ"]],
        kid: ["น้องริมคลอง", ["พี่ๆ มาตกปลาเหรอ หนูก็ชอบมาเล่นริมน้ำ", "หนูชอบพายเรือเล่น แล้วก็ช่วยเก็บมะพร้าวที่สวนด้วยนะ", "ตกปลาตัวใหญ่ๆ ได้คะแนนเยอะ แต่ต้องใจเย็นๆ นะพี่"]],
        uncle: ["ลุงฟ้า", ["สวัสดีหลาน ลุงฟ้าเองนะ พายเรืออยู่แถวคลองนี้แหละ", "เรือคือพาหนะของคนคลอง จะไปสวน ไปตลาด ก็ต้องพายเรือทั้งนั้น", "สมัยก่อนคลองเป็นทั้งทางสัญจร แหล่งอาหาร และทางขนผลไม้ออกไปขาย", "ปั่นเที่ยวให้สนุกนะ แวะสวนส้มกับตลาดเรือด้วยล่ะ เจอกันใหม่!"]],
        vendor: ["ป้าขายก๋วยเตี๋ยว", ["ก๋วยเตี๋ยวเรือร้อนๆ มาแล้วจ้า", "คลองนี้เคยเป็นทั้งทางสัญจรและแหล่งอาหารของคนรุ่นก่อนเลยนะ", "อยากช่วยป้าเสิร์ฟไหมล่ะ แตะที่ไอคอนชามก๋วยเตี๋ยวบนแผนที่ได้เลย"]],
      };
      Object.assign(SAY, VSAY);
      const $ = (id) => document.getElementById(id);
      const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      let S = { coins: 0, items: { fish: 0, fruit: 0, noodle: 0 }, plays: {}, up: { fish: 0, fruit: 0, noodle: 0 }, best: {}, done: {}, fin: 0, at: 0, char: CH_PRESETS[0], charDone: 0 };
      try { Object.assign(S, JSON.parse(localStorage.getItem("kbm") || "{}")); } catch (e) {}
      if (!S.items) S.items = { fish: 0, fruit: 0, noodle: 0 };
      if (!S.plays) S.plays = {};
      if (!S.char || !S.char.k) { S.char = CH_PRESETS[0]; S.charDone = 0; }
      const save = () => { try { localStorage.setItem("kbm", JSON.stringify(S)); } catch (e) {} };
      const road = $("road2"), RL = road.getTotalLength();
      const pt = (f) => road.getPointAtLength(f * RL);
      // nodes
      const nodes = $("nodes"), GAMES_GATE = {};
      let scene = "map";
      Object.entries(GAMES).forEach(([k, G]) => {
        const p = pt(G.at);
        G.p = p;
        const lw = G.name.length * 12 + 26, CC = { fish: ["#9b5de5", "#eadcff"], fruit: ["#ff8a14", "#ffe9c4"], noodle: ["#f0443a", "#ffd9d4"] }[k];
        nodes.insertAdjacentHTML("beforeend", `<g class="node" id="n_${k}" transform="translate(${p.x},${p.y - 64}) scale(0.72)">
          <circle r="40" fill="none" stroke="#fff" stroke-width="4" opacity="0.9"><animate attributeName="r" values="40;62" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="1.6s" repeatCount="indefinite"/></circle>
          <g><animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="1.6s" repeatCount="indefinite"/>
          <ellipse cx="0" cy="40" rx="22" ry="6" fill="#0003"/>
          <path d="M-10 38 L0 56 L10 38z" fill="${CC[0]}" stroke="#4a3322" stroke-width="4" stroke-linejoin="round"/>
          <circle r="43" fill="${CC[0]}" stroke="#4a3322" stroke-width="5"/>
          <circle r="34" fill="${CC[1]}" stroke="#fff" stroke-width="3"/>
          <image href="${ICO.url(G.ic)}" x="-26" y="-26" width="52" height="52"/>
          <rect x="${-lw / 2}" y="46" width="${lw}" height="28" rx="14" fill="${CC[0]}" stroke="#4a3322" stroke-width="4"/>
          <text x="0" y="66" text-anchor="middle" font-weight="700" font-size="17" fill="#fff" stroke="#4a3322" stroke-width="0.6">${G.name}</text>
          <g id="st_${k}" opacity="0"><circle cx="30" cy="-30" r="16" fill="#4cc35a" stroke="#4a3322" stroke-width="4"/><image href="${ICO.url("check")}" x="20" y="-40" width="20" height="20"/></g>
          </g>
        </g>`);
        $("n_" + k).addEventListener("click", () => go(k));

        W2.addEventListener("wheel", (e) => { if (scene === "village") { e.preventDefault(); V.zoomBy(e.deltaY < 0 ? 1.12 : 1 / 1.12); } }, { passive: false });
        $("zhelp").onclick = () => { if ($("ov").classList.contains("off")) villageHelp(); };
        $("zin").onclick = () => V.zoomBy(1.25);
        $("zout").onclick = () => V.zoomBy(0.8);
      }
      $("vback").innerHTML = ICO.html("bear", 26) + " กลับไปปั่น";
      $("vsum").innerHTML = ICO.html("trophy", 26) + " สรุปทริป";
      $("vback").onclick = () => { if ($("ov").classList.contains("off")) leaveVillage(); };
      $("vsum").onclick = () => { if ($("ov").classList.contains("off")) summary(); };
      // tapping a stop asks: just ride there, or ride there and play
      function go(k) {
        if (playing || !$("ov").classList.contains("off")) return;
        const G = GAMES[k], here = Math.abs(cur - G.at) < 0.01;
        card(`<h1>${ICO.html(G.ic, 38)} ${G.name}</h1>
          <p style="margin:2px 0 10px">${here ? "คุณอยู่ที่นี่แล้ว" : "จะทำอะไรดี?"}${S.best[k] ? ` · สถิติ <b>${S.best[k]}</b>` : ""}</p>
          <div style="display:flex;flex-direction:column;gap:8px;align-items:stretch;max-width:260px;margin:0 auto">
            <button id="gplay">${ICO.html("star", 24)} เล่นเกม</button>
            ${here ? "" : `<button id="gride" class="alt">${ICO.html("bear", 24)} ปั่นไปที่นี่เฉยๆ</button>`}
            <button id="okc" style="background:#bbb">ยกเลิก</button>
          </div>`);
        $("okc").onclick = closeCard;
        $("gplay").onclick = () => { closeCard(); play(k); };
        if ($("gride")) $("gride").onclick = () => {
          closeCard(); playing = "ride";
          ride(G.at, () => { playing = null; S.at = G.at; save(); toast("ถึง" + G.name + "แล้ว"); });
        };
      }
      function play(k) {
        playing = k;
        ride(GAMES[k].at, () => {
          S.at = GAMES[k].at; save();
          $("game").innerHTML = `<iframe src="${GAMES[k].url(S.up[k])}" allow="autoplay"></iframe>`;
          $("game").classList.remove("off");
        });
      }
      addEventListener("message", (e) => {
        const m = e.data || {};
        if (!GAMES[playing] || !m.type) return;
        const k = playing;
        $("game").classList.add("off");
        $("game").innerHTML = "";
        playing = null;
        if (m.type !== "done") return;
        const sc = m.score | 0, earn = Math.max(0, Math.round(sc * GAMES[k].coin));
        const oldTier = tierOf(k, S.best[k] || 0), newBest = sc > (S.best[k] || 0);
        if (newBest) S.best[k] = sc;
        S.items[k] += earn;
        const tier = tierOf(k, S.best[k] || 0), first = !S.done[k];
        S.done[k] = 1;
        const fi = (S.plays[k] || 0) % FACTS[k].length;
        S.plays[k] = (S.plays[k] || 0) + 1;
        save(); hud();
        const starsHtml = `<span class="stars">${[1, 2, 3].map((i) => `<span style="opacity:${i <= tier ? 1 : 0.2}">${ICO.html("star", 30)}</span>`).join("")}</span>`;
        const up = tier > oldTier ? `<p style="margin:2px 0"><b>${TIERN[tier]}</b> ${tier === 1 ? "ปลดล็อกของที่ระลึก: " + ICO.html(SOUV[k].ic, 24) + " " + SOUV[k].n : "เลื่อนระดับแล้ว!"}</p>` : "";
        const all = Object.keys(S.done).length === 3;
        const fin = all && !S.fin ? (S.fin = 1, save(), `<p style="margin:2px 0"><b>${ICO.html("party", 26)} ครบทริปแล้ว!</b> เหยียบครบทั้ง 3 จุดของคลองบางมด</p>`) : "";
        card(`<h1>${ICO.html(GAMES[k].ic, 38)} ${GAMES[k].name}</h1>
          <p style="margin:2px 0">คะแนน <b>${sc}</b>${newBest ? " " + ICO.html("trophy", 24) + " สถิติใหม่!" : ""} · ได้ ${ICO.html(GAMES[k].ic, 22)} <b>+${earn}</b></p>
          <div>${starsHtml}</div>${up}${fin}
          <div class="fact"><b>รู้ไหม?</b> ${FACTS[k][fi]}</div>
          <div style="display:flex;gap:8px;justify-content:center;margin-top:6px"><button id="okc">กลับแผนที่</button><button id="shp" class="alt">${ICO.html("shop", 24)} ร้านชุมชน</button></div>${all ? `<button id="sum" style="margin-top:8px;background:#9b5de5;box-shadow:0 4px 0 #6b3bb0">${ICO.html("trophy", 24)} ดูสรุปคะแนนทริป</button><button id="gov" style="margin-top:8px;background:#2fb36b;box-shadow:0 4px 0 #1e7d49">เดินต่อไปย่านชุมชน</button>` : ""}`);
        if ($("gov")) $("gov").onclick = () => { closeCard(); setTimeout(goGate, 50); };
        $("shp").onclick = shop;
        if ($("sum")) $("sum").onclick = summary;
        $("okc").onclick = closeCard;
      });
      function summary() {
        const ks = Object.keys(GAMES), total = ks.reduce((a, k) => a + (S.best[k] || 0), 0), stars = ks.reduce((a, k) => a + tierOf(k, S.best[k] || 0), 0);
        const rank = stars >= 8 ? "ปราชญ์คลองบางมด" : stars >= 5 ? "นักปั่นสายท่องคลอง" : "นักปั่นหน้าใหม่";
        const o = ks.slice().sort((x, y) => (S.best[y] || 0) - (S.best[x] || 0)), order = [o[1], o[0], o[2]], H = [84, 116, 62], C = [["#cfd6de", "#9aa5b1"], ["#ffd23f", "#e0a800"], ["#e6a566", "#b97532"]], N = [2, 1, 3];
        const pod = order.map((k, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;min-width:0">
          ${i === 1 ? `<div style="margin-bottom:-2px">${ICO.html("trophy", 30)}</div>` : ""}
          <div style="background:#fff;border:3px solid #e3cfa8;border-radius:50%;width:${i === 1 ? 58 : 48}px;height:${i === 1 ? 58 : 48}px;display:flex;align-items:center;justify-content:center">${ICO.html(GAMES[k].ic, i === 1 ? 38 : 30)}</div>
          <div style="font-size:${i === 1 ? 24 : 20}px;font-weight:800;color:#c2521a;line-height:1.2">${S.best[k] || 0}</div>
          <div style="width:100%;height:${H[i]}px;margin-top:4px;background:linear-gradient(${C[i][0]},${C[i][1]});border:3px solid #4a3322;border-bottom:0;border-radius:12px 12px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;color:#4a3322">
            <div style="font-size:${i === 1 ? 38 : 30}px;font-weight:800;line-height:1">${N[i]}</div><div style="font-size:13px;font-weight:700;line-height:1.1;margin-top:2px">${GAMES[k].name}</div></div></div>`).join("");
        card(`<h1 style="font-size:26px">${ICO.html("party", 34)} สรุปทริป${S.name ? " · " + esc(S.name) : ""}</h1>
          <div style="display:flex;gap:6px;align-items:flex-end;margin:10px 4px 0">${pod}</div>
          <div style="height:10px;background:#7a5230;border-radius:0 0 10px 10px;margin:0 4px"></div>
          <div style="margin-top:10px;font-size:15px;opacity:.7">คะแนนรวม</div><div style="font-size:42px;font-weight:800;color:#c2521a;line-height:1">${total}</div>
          <p style="margin:6px 0 2px">ตรา ${stars}/9 · ฉายา <b style="color:#9b5de5">${rank}</b></p>
          <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px">${scene === "map" ? `<button id="gov2" style="background:#2fb36b;box-shadow:0 4px 0 #1e7d49">เดินต่อไปย่านชุมชน</button>` : ""}<button id="okc">ปิด</button></div>`);
        $("okc").onclick = closeCard;
        if ($("gov2")) $("gov2").onclick = () => { closeCard(); setTimeout(goGate, 50); };
      }
      function passport() {
        card(`<h1>${ICO.html("book", 38)} สมุดพาสปอร์ต${S.name ? "<br><span style='font-size:20px'>ของ " + esc(S.name) + "</span>" : ""}</h1><p style="margin:0;font-size:15px">เล่นแต่ละจุดให้ได้คะแนน เพื่อสะสมตราและของที่ระลึกจากชุมชน</p>` + Object.keys(GAMES).map((k) => {
          const t = tierOf(k, S.best[k] || 0), sv = SOUV[k];
          return `<div class="up"><div class="ic">${ICO.html(GAMES[k].ic, 44)}</div><div class="tx"><b>${GAMES[k].name}</b><br>${t ? TIERN[t] : "ยังไม่ได้ตรา"} · สถิติ ${S.best[k] || 0}<br><span style="opacity:${t ? 1 : 0.35}">${ICO.html(sv.ic, 20)} ${t ? sv.n : "ของที่ระลึก (เล่นให้ได้ " + TH[k][0] + " คะแนน)"}</span></div><span class="stars">${[1, 2, 3].map((i) => `<span style="opacity:${i <= t ? 1 : 0.2}">${ICO.html("star", 24)}</span>`).join("")}</span></div>`;
        }).join("") + (Object.keys(S.done).length === 3 ? `<button id="sum2" class="alt" style="margin-right:6px">สรุปคะแนนทริป</button>` : "") + `<button id="okc">ปิด</button>`);
        $("okc").onclick = closeCard;
        if ($("sum2")) $("sum2").onclick = summary;
      }
      $("stamps").onclick = () => { if (!playing && $("ov").classList.contains("off")) passport(); };
      function shop() {
        card(`<h1>${ICO.html("shop", 36)} ร้านชุมชน</h1><p style="margin:0;font-size:16px">เอาผลผลิตที่ได้มาแลกอัปเกรด ของจะสวยขึ้นตามเลเวล</p>` + SHOP.map((it) => {
          const L = S.up[it.k], max = L >= 3, cost = COST[L], ic = GAMES[it.k].ic;
          return `<div class="up"><div class="ic">${ICO.html(it.ic, 44)}</div><div class="tx"><b>${it.n}</b><br>${it.d}<br><span class="dots">${"●".repeat(L)}${"○".repeat(3 - L)}</span></div>${max ? "<b>เต็ม</b>" : `<button data-k="${it.k}" ${S.items[it.k] < cost ? "disabled" : ""}>${ICO.html(ic, 20)} ${cost}</button>`}</div>`;
        }).join("") + `<p style="font-size:14px;margin:4px 0">มี ${["fish", "fruit", "noodle"].map((k) => ICO.html(GAMES[k].ic, 20) + " " + S.items[k]).join(" · ")}</p><button id="okc">ปิด</button>`);
        $("okc").onclick = closeCard;
        $("card").querySelectorAll("button[data-k]").forEach((b) => (b.onclick = () => {
          const k = b.dataset.k, cost = COST[S.up[k]];
          if (S.items[k] < cost) return;
          S.items[k] -= cost; S.up[k]++; save(); hud(); makeMap(); shop(); toast("อัปเกรดสำเร็จ!");
        }));
      }
      $("shopbtn").onclick = () => { if (!playing) shop(); };
      // mascot picker
      let pvOn = false;
      function creator(first, splash) {
        let L = CH_PRESETS.find((m) => m.k === S.char.k) || CH_PRESETS[0];
        card((splash ? `<img src="play/assets/game/logo.png" alt="Klong Bang Mot" style="width:40%;max-width:140px;display:block;margin:0 auto 2px"><div style="font-size:15px;margin-bottom:2px">ทัวร์ปั่นจักรยานชุมชนคลองบางมด</div><div style="font-weight:700;font-size:20px;color:#c2521a">เลือกตัวละครของคุณ</div>` : `<h1>${first ? "เลือกตัวละครของคุณ" : "เปลี่ยนตัวละคร"}</h1>`) + `
          <canvas id="pv" width="300" height="320" style="width:${splash ? 104 : 160}px;height:${splash ? 110 : 170}px"></canvas>
          <div id="nm" style="font-size:24px;font-weight:700;color:#c2521a"></div>
          <div class="pre" id="pre"></div>
          <input id="pname" maxlength="12" placeholder="พิมพ์ชื่อของคุณ" style="display:block;width:80%;margin:8px auto 0;font:inherit;font-size:20px;font-weight:700;text-align:center;padding:6px 10px;border:3px solid #e3cfa8;border-radius:14px;color:#4a3322;background:#fff;outline:none">
          <button id="okc" style="margin-top:8px">${first ? "เริ่มปั่น!" : "ตกลง"}</button>`);
        const pre = $("pre");
        const cs = [];
        CH_PRESETS.forEach((p) => {
          const c = document.createElement("canvas");
          c.width = 104; c.height = 120;
          drawChibi(c.getContext("2d"), 52, 114, 40, p, {});
          c.onclick = () => { L = p; mark(); };
          pre.appendChild(c); cs.push(c);
        });
        function mark() { cs.forEach((c, i) => c.classList.toggle("sel", CH_PRESETS[i] === L)); $("nm").textContent = L.n; }
        mark();
        $("okc").onclick = () => {
          S.char = Object.assign({}, L); S.name = $("pname").value.trim().slice(0, 12); S.charDone = 1; save(); pvOn = false; closeCard();
          if (first) { if (!S.seen) intro(); else toast((S.name ? "สวัสดี " + S.name + "! " : "") + "แตะชาวบ้านบนแผนที่เพื่อคุยได้"); }
        };
        $("pname").value = S.name || "";
        pvOn = true;
        const pv = $("pv"), pg = pv.getContext("2d"), t0 = performance.now();
        (function f(n) {
          if (!pvOn || !document.body.contains(pv)) { pvOn = false; return; }
          const t = (n - t0) / 1000;
          pg.clearRect(0, 0, 300, 320);
          pg.fillStyle = "rgba(60,40,20,0.15)";
          pg.beginPath(); pg.ellipse(150, 308, 62, 9, 0, 0, 7); pg.fill();
          drawChibi(pg, 150, 304, 88, L, { t, lift: Math.abs(Math.sin(t * 2.2)) * 0.05, mood: Math.sin(t * 0.8) > 0.4 ? 1 : 0, blink: Math.sin(t * 1.7) > 0.96 ? 1 : 0 });
          requestAnimationFrame(f);
        })(t0);
      }
      function intro() {
        card(`<h1>Bike Tour at<br>Klong Bang Mot</h1><p>ปั่นเที่ยวคลองบางมด<br>แตะวงกลมสีบนแผนที่เพื่อเล่นด่าน<br>แตะชาวบ้านที่มีฟองคำพูดเพื่อคุยด้วย<br>เก็บผลผลิตไปอัปเกรดของได้</p><button id="okc">เริ่มปั่น</button>`);
        $("okc").onclick = () => { S.seen = 1; save(); closeCard(); };
      }
      $("charbtn").onclick = () => { if (!playing && $("ov").classList.contains("off")) creator(false); };
      // start
      place(0);
      hud();
      card(`<img src="play/assets/game/logo.png" alt="Klong Bang Mot" style="width:84%;max-width:300px;display:block;margin:0 auto 6px"><p style="font-size:17px">กิจกรรมปั่นจักรยานทัวร์ชุมชน<br>คลองบางมด<br>ทำกิจกรรมกับชาวบ้านในชุมชน</p><button id="okc">เริ่มปั่น</button>`);
      $("okc").onclick = () => creator(true);
    </script>
  </body>
</html>

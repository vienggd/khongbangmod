<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ก๋วยเตี๋ยวเรือ 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Athiti:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: #1d2b3a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: "Athiti", system-ui, sans-serif; font-weight: 500; font-size: 17px; }
      #wrap { position: relative; width: min(420px, 100vw, calc(100vh * 2 / 3)); aspect-ratio: 2/3; overflow: hidden; border-radius: 14px; background: #bfe6ff; box-shadow: 0 10px 40px #0006; }
      canvas { width: 100%; height: 100%; display: block; touch-action: none; }
      .ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; background: #0005; transition: opacity 0.4s; }
      .ov.off { opacity: 0; pointer-events: none; }
      .card { background: #fffdf3; border: 4px solid #6b5538; border-radius: 26px; padding: 22px 20px; text-align: center; color: #4a3a28; box-shadow: 0 7px 0 #0003, inset 0 0 0 3px #f6e2b0; width: 100%; }
      h1 { margin: 0 0 8px; color: #c2521a; font-size: 30px; line-height: 1.1; }
      p { margin: 6px 0; line-height: 1.45; }
      button { font: inherit; font-weight: 700; font-size: 20px; color: #fff; background: #ff9a2e; border: 0; border-radius: 999px; padding: 10px 30px; margin-top: 12px; box-shadow: 0 4px 0 #c0611a; cursor: pointer; }
      button:active { transform: translateY(3px); box-shadow: 0 1px 0 #c0611a; }
      #mute { display: none; }
      #gear { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 42px; height: 42px; padding: 0; margin: 0; border-radius: 50%; background: #fffd; border: 3px solid #4a3322; border-bottom-width: 6px; box-shadow: none; display: none; align-items: center; justify-content: center; z-index: 4; }
      #gear.on { display: flex; }
      #gear svg { width: 24px; height: 24px; fill: #5b4630; transition: transform 0.4s; }
      #gear:hover svg { transform: rotate(60deg); }
      #pz { position: absolute; inset: 0; background: #0008; display: none; align-items: center; justify-content: center; padding: 24px; z-index: 6; }
      #pz.on { display: flex; }
      #pz .card { max-width: 350px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 20px; border: 4px solid #7a5230; border-radius: 22px; box-shadow: 0 6px 0 #00000030; }
      #pz .card h1 { margin: 0; color: #b2561b; font-size: 30px; }
      #pz .card button { margin: 0; font-size: 18px; font-weight: 600; padding: 10px 22px; border: 3px solid #4a3322; border-bottom-width: 6px; box-shadow: none; }
      #pz .card button.alt { background: #2a8fc0; }
      #pz .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
      #pz #pz_snd { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <button id="mute" title="เปิด/ปิดเสียง"></button>
      <button id="gear" title="ตั้งค่า"><svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1l.4 2.6h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
      <div id="pz"><div class="card"><h1>หยุดชั่วคราว</h1><button id="pz_snd" class="alt"></button><div class="row"><button id="pz_go">เล่นต่อ</button><button id="pz_out" class="alt">ออกไปหน้าแรก</button></div></div></div>
      <div class="ov" id="ov"></div>
    </div>
    <script src="../icons.js"></script>
    <script>
      /* ============ tiny 3D engine on canvas 2D: perspective camera, cel shading, toon outlines ============ */
      const cv = document.getElementById("c"),
        g = cv.getContext("2d"),
        W = 420,
        H = 630,
        DPR = Math.min(2, devicePixelRatio || 1);
      cv.width = W * DPR;
      cv.height = H * DPR;
      g.scale(DPR, DPR);
      const $ = (id) => document.getElementById(id);
      const lerp = (a, b, k) => a + (b - a) * k,
        damp = (a, b, s, dt) => lerp(a, b, 1 - Math.exp(-s * dt)),
        easeOut = (x) => 1 - Math.pow(1 - x, 3),
        rnd = (a, b) => a + Math.random() * (b - a);
      const FOC = 440;
      const CAM = { x: 0, y: 6.6, z: -8.6, pitch: 0.44, cy: 0.5 };
      function P(x, y, z) {
        const dx = x - CAM.x,
          dy = y - CAM.y,
          dz = z - CAM.z,
          c = Math.cos(CAM.pitch),
          s = Math.sin(CAM.pitch);
        const yy = dy * c + dz * s,
          zz = -dy * s + dz * c,
          k = FOC / zz;
        return { x: W / 2 + dx * k, y: H * CAM.cy - yy * k, z: zz, k };
      }
      const LV = (() => {
        const v = [-0.45, 0.8, -0.4],
          n = Math.hypot(...v);
        return v.map((a) => a / n);
      })();
      // cel shading: 4 flat bands
      function cel(n) {
        const d = n[0] * LV[0] + n[1] * LV[1] + n[2] * LV[2];
        return d > 0.75 ? 1.1 : d > 0.4 ? 0.98 : d > 0.05 ? 0.84 : 0.72;
      }
      function shade(hex, m) {
        const n = parseInt(hex.slice(1), 16);
        const f = (v) => Math.max(0, Math.min(255, (v * m) | 0));
        return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
      }
      const OUT = "#4a3322";
      function poly(ps, fill, line = 2) {
        g.beginPath();
        ps.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
        g.closePath();
        g.fillStyle = fill;
        g.fill();
        if (line) {
          g.strokeStyle = OUT;
          g.lineWidth = line;
          g.lineJoin = "round";
          g.stroke();
        }
      }
      const facing = (n, c) => n[0] * (CAM.x - c[0]) + n[1] * (CAM.y - c[1]) + n[2] * (CAM.z - c[2]) > 0;
      const norm = (v) => {
        const l = Math.hypot(...v) || 1;
        return [v[0] / l, v[1] / l, v[2] / l];
      };
      // explicit-normal face
      function face(vs, n, col, line = 2) {
        const c = vs.reduce((a, v) => [a[0] + v[0] / vs.length, a[1] + v[1] / vs.length, a[2] + v[2] / vs.length], [0, 0, 0]);
        if (!facing(n, c)) return;
        poly(vs.map((v) => P(v[0], v[1], v[2])), shade(col, cel(n)), line);
      }
      // face with normal worked out from the points, flipped to point away from `ref`
      function faceAuto(vs, col, ref, line = 2) {
        const a = vs[0],
          b = vs[1],
          c = vs[2];
        const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]],
          v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
        let n = norm([u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]]);
        const m = vs.reduce((s, p) => [s[0] + p[0] / vs.length, s[1] + p[1] / vs.length, s[2] + p[2] / vs.length], [0, 0, 0]);
        if (n[0] * (m[0] - ref[0]) + n[1] * (m[1] - ref[1]) + n[2] * (m[2] - ref[2]) < 0) n = n.map((q) => -q);
        face(vs, n, col, line);
      }
      function box(x, y0, z, sx, sy, sz, col, topCol, line = 2) {
        const x0 = x - sx / 2,
          x1 = x + sx / 2,
          y1 = y0 + sy,
          z0 = z - sz / 2,
          z1 = z + sz / 2;
        face([[x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]], [0, 1, 0], topCol || col, line);
        face([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], [0, 0, -1], col, line);
        face([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], [0, 0, 1], col, line);
        face([[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0]], [-1, 0, 0], col, line);
        face([[x1, y0, z0], [x1, y0, z1], [x1, y1, z1], [x1, y1, z0]], [1, 0, 0], col, line);
      }
      function cyl(x, y0, z, r0, r1, h, col, capCol, N = 14, phase = 0, line = 2) {
        for (let i = 0; i < N; i++) {
          const a0 = phase + (i / N) * 6.2832,
            a1 = phase + ((i + 1) / N) * 6.2832,
            am = (a0 + a1) / 2;
          const n = norm([Math.cos(am), (r0 - r1) / h, Math.sin(am)]);
          face(
            [
              [x + Math.cos(a0) * r0, y0, z + Math.sin(a0) * r0],
              [x + Math.cos(a1) * r0, y0, z + Math.sin(a1) * r0],
              [x + Math.cos(a1) * r1, y0 + h, z + Math.sin(a1) * r1],
              [x + Math.cos(a0) * r1, y0 + h, z + Math.sin(a0) * r1],
            ],
            n,
            col,
            line,
          );
        }
        if (capCol && CAM.y > y0 + h) disc(x, y0 + h, z, r1, capCol, N, phase, line);
      }
      function disc(x, y, z, r, col, N = 16, phase = 0, line = 2) {
        const ps = [];
        for (let i = 0; i < N; i++) ps.push(P(x + Math.cos(phase + (i / N) * 6.2832) * r, y, z + Math.sin(phase + (i / N) * 6.2832) * r));
        poly(ps, col, line);
      }
      function ball(x, y, z, r, col, line = 2.2) {
        const p = P(x, y, z),
          rad = r * p.k;
        const gr = g.createRadialGradient(p.x - rad * 0.38, p.y - rad * 0.45, rad * 0.05, p.x, p.y, rad);
        gr.addColorStop(0, shade(col, 1.22));
        gr.addColorStop(0.55, shade(col, 1.0));
        gr.addColorStop(1, shade(col, 0.72));
        g.fillStyle = gr;
        g.beginPath();
        g.arc(p.x, p.y, rad, 0, 7);
        g.fill();
        if (line) {
          g.strokeStyle = OUT;
          g.lineWidth = line;
          g.stroke();
        }
        return p;
      }
      function shadow(x, y, z, r, a = 0.22) {
        const p = P(x, y, z);
        g.fillStyle = `rgba(30,20,10,${a})`;
        g.beginPath();
        g.ellipse(p.x, p.y, r * p.k, r * p.k * 0.38, 0, 0, 7);
        g.fill();
      }
      const EMO = { "🌶️": "chili", "🌿": "leaf", "🥩": "pork", "🥚": "egg", "🍖": "pork", "🍜": "bowl" };
      function emoji(e, x, y, size) {
        if (EMO[e]) return drawIco(g, EMO[e], x, y, size * 1.25);
        g.font = size + "px serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText(e, x, y);
      }
      function glow(x, y, r, col, a) {
        g.save();
        g.globalCompositeOperation = "lighter";
        const gr = g.createRadialGradient(x, y, 0, x, y, r);
        gr.addColorStop(0, col.replace("A", a));
        gr.addColorStop(1, col.replace("A", 0));
        g.fillStyle = gr;
        g.fillRect(x - r, y - r, r * 2, r * 2);
        g.restore();
      }

      /* ============ world ============ */
      const MENU = [
        { n: "ต้มยำ", c: "#e8553a", e: "🌶️" },
        { n: "น้ำใส", c: "#f6e7b0", e: "🌿" },
        { n: "น้ำตก", c: "#7a3b22", e: "🥩" },
      ];
      const CUSTX = [-3.5, 0, 3.5];
      const POTX = [-2.3, -0.8, 0.7];
      const PIER_Y = 0.9,
        PIER_Z = 3.4,
        DECK_Y = 0.62,
        LANE_Z = -2.7,
        BOAT_Z = LANE_Z + 0.5,
        VEND_X = 2.6,
        POT_Z = LANE_Z + 1.15;

      // ----- characters -----
      function hx(hex, m) {
        const n = parseInt(hex.slice(1), 16);
        const f = (v) => Math.max(0, Math.min(255, (v * m) | 0));
        return "#" + [n >> 16, (n >> 8) & 255, n & 255].map((v) => f(v).toString(16).padStart(2, "0")).join("");
      }
      const PAL = {
        skin: ["#f9d6b5", "#f3c59c", "#e4ad80", "#d39a6c", "#f8dcc0"],
        hair: ["#3a2418", "#5a3a22", "#2a1d1d", "#7a4a2a", "#1f1f2a", "#a8643a"],
        style: ["bob", "cap", "short", "pony", "bun", "twin"],
        shirt: ["#ef7f8e", "#ffffff", "#5fb3e8", "#ffd45a", "#8ed17a", "#c49ae8", "#ff9a5a"],
        bottom: ["#f6c640", "#2f8f9a", "#3b4a8a", "#e86a6a", "#6a9a4a"],
        shoe: ["#4aa3df", "#f4f4f4", "#e8553a", "#2fa87a", "#6b4a2b"],
        cap: ["#e86a78", "#6fb6e0", "#f2b134", "#7ac26a", "#b07cd8"],
      };
      const pick = (a) => a[(Math.random() * a.length) | 0];
      function makeLook(avoid) {
        let L, tries = 0;
        do {
          L = { skin: pick(PAL.skin), hair: pick(PAL.hair), style: pick(PAL.style), shirt: pick(PAL.shirt), bottom: pick(PAL.bottom), shoe: pick(PAL.shoe), cap: pick(PAL.cap) };
        } while (avoid && avoid.some((q) => q && (q.shirt === L.shirt || q.style === L.style)) && ++tries < 14);
        return L;
      }
      const VENDOR = { skin: "#f3c59c", hair: "#2a1d1d", style: "bun", shirt: "#e8553a", bottom: "#5a4a3a", shoe: "#6b4a2b", apron: 1, flower: "#ffd23f" };
      function person(x, y0, z, o, lift = 0, mood = 0, sc = 1) {
        shadow(x, y0 + 0.01, z, 0.7 * sc);
        const b0 = P(x, y0, z),
          u = b0.k * sc,
          cx = b0.x,
          Y = (h) => b0.y - (h + lift * sc) * u,
          LW = Math.max(2, u * 0.035);
        g.lineJoin = "round";
        g.lineCap = "round";
        const fillP = (col, shadeCol) => {
          g.fillStyle = col;
          g.fill();
          if (shadeCol) {
            g.save();
            g.clip();
            g.fillStyle = shadeCol;
            g.fillRect(cx - 3 * u, Y(0.78), 6 * u, 3 * u);
            g.restore();
          }
          g.strokeStyle = OUT;
          g.lineWidth = LW;
          g.stroke();
        };
        const ell = (px, py, rx, ry, col, rot = 0) => {
          g.beginPath();
          g.ellipse(px, py, rx, ry, rot, 0, 7);
          fillP(col);
        };
        const tube = (x1, y1, x2, y2, w, col) => {
          g.strokeStyle = OUT;
          g.lineWidth = w + LW * 2;
          g.beginPath();
          g.moveTo(x1, y1);
          g.lineTo(x2, y2);
          g.stroke();
          g.strokeStyle = col;
          g.lineWidth = w;
          g.beginPath();
          g.moveTo(x1, y1);
          g.lineTo(x2, y2);
          g.stroke();
        };
        // ---- legs & shoes
        [-1, 1].forEach((sd) => {
          tube(cx + sd * 0.17 * u, Y(0.5), cx + sd * 0.17 * u, Y(0.18), 0.2 * u, o.skin);
          tube(cx + sd * 0.17 * u, Y(0.2), cx + sd * 0.17 * u, Y(0.14), 0.22 * u, "#ffffff");
          g.beginPath();
          g.ellipse(cx + sd * 0.19 * u, Y(0.06), 0.21 * u, 0.12 * u, 0, 0, 7);
          fillP(o.shoe);
        });
        // ---- arms (behind torso)
        const wave = mood === 1 ? Math.sin(time * 14) * 0.08 : 0;
        [-1, 1].forEach((sd) => {
          const sx = cx + sd * 0.34 * u,
            sy = Y(0.92);
          let hx2 = cx + sd * 0.68 * u,
            hy2 = Y(0.58);
          if (mood === 1 && sd === 1) (hx2 = cx + 0.74 * u), (hy2 = Y(1.3 + wave));
          tube(sx, sy, hx2, hy2, 0.2 * u, o.shirt);
          g.beginPath();
          g.arc(hx2, hy2, 0.11 * u, 0, 7);
          fillP(o.skin);
        });
        // ---- shorts + torso
        g.beginPath();
        g.roundRect(cx - 0.34 * u, Y(0.62), 0.68 * u, 0.24 * u, 0.08 * u);
        fillP(o.bottom);
        g.beginPath();
        g.moveTo(cx - 0.27 * u, Y(1.0));
        g.quadraticCurveTo(cx - 0.4 * u, Y(0.8), cx - 0.36 * u, Y(0.56));
        g.lineTo(cx + 0.36 * u, Y(0.56));
        g.quadraticCurveTo(cx + 0.4 * u, Y(0.8), cx + 0.27 * u, Y(1.0));
        g.closePath();
        fillP(o.shirt, "rgba(0,0,0,0.1)");
        if (o.apron) {
          g.beginPath();
          g.roundRect(cx - 0.23 * u, Y(0.94), 0.46 * u, 0.5 * u, 0.1 * u);
          fillP("#fffaf0");
        } else {
          // collar
          g.strokeStyle = "rgba(255,255,255,0.8)";
          g.lineWidth = LW * 1.6;
          g.beginPath();
          g.arc(cx, Y(1.0), 0.16 * u, 0.15 * Math.PI, 0.85 * Math.PI);
          g.stroke();
        }
        // ---- head
        const rad = 0.82 * u,
          px = cx,
          py = Y(1.1) - rad * 0.95,
          hr = o.hair,
          hs = hx(o.hair, 0.8);
        const hairBack = (rx, ry, dy) => {
          g.beginPath();
          g.ellipse(px, py + dy, rx, ry, 0, 0, 7);
          fillP(hr);
        };
        if (o.style === "bob" || o.style === "twin" || o.style === "pony" || o.style === "bun") {
          g.beginPath();
          g.moveTo(px - rad * 1.04, py - rad * 0.1);
          g.bezierCurveTo(px - rad * 1.2, py + rad * 0.5, px - rad * 1.0, py + rad * 0.85, px - rad * 0.8, py + rad * 0.88);
          g.lineTo(px + rad * 0.8, py + rad * 0.88);
          g.bezierCurveTo(px + rad * 1.0, py + rad * 0.85, px + rad * 1.2, py + rad * 0.5, px + rad * 1.04, py - rad * 0.1);
          g.bezierCurveTo(px + rad * 1.1, py - rad * 1.05, px - rad * 1.1, py - rad * 1.05, px - rad * 1.04, py - rad * 0.1);
          fillP(o.style === "bob" ? hr : hs);
        }
        if (o.style === "twin") [-1, 1].forEach((sd) => {
          g.beginPath();
          g.ellipse(px + sd * rad * 1.12, py + rad * 0.55, rad * 0.22, rad * 0.45, sd * -0.25, 0, 7);
          fillP(hr);
          ell(px + sd * rad * 1.05, py + rad * 0.2, rad * 0.11, rad * 0.11, o.cap);
        });
        if (o.style === "pony") {
          g.beginPath();
          g.ellipse(px + rad * 1.08, py + rad * 0.45, rad * 0.22, rad * 0.5, -0.3, 0, 7);
          fillP(hr);
          ell(px + rad * 0.98, py - rad * 0.05, rad * 0.11, rad * 0.11, o.cap);
        }
        if (o.style === "bun") {
          ell(px, py - rad * 1.12, rad * 0.32, rad * 0.3, hr);
          ell(px + rad * 0.42, py - rad * 1.02, rad * 0.11, rad * 0.11, o.flower || o.cap);
        }
        // ears
        [-1, 1].forEach((sd) => ell(px + sd * rad * 0.98, py + rad * 0.12, rad * 0.14, rad * 0.17, o.skin));
        // face
        g.beginPath();
        g.ellipse(px, py, rad * 1.0, rad * 0.93, 0, 0, 7);
        fillP(o.skin);
        // eyes
        const ey = py + rad * 0.14;
        [-1, 1].forEach((sd) => {
          const ex = px + sd * rad * 0.37;
          if (mood === 1) {
            g.strokeStyle = "#3a2418";
            g.lineWidth = LW * 1.7;
            g.beginPath();
            g.arc(ex, ey + rad * 0.07, rad * 0.12, Math.PI * 1.05, Math.PI * 1.95);
            g.stroke();
          } else {
            g.beginPath();
            g.ellipse(ex, ey, rad * 0.12, rad * 0.16, 0, 0, 7);
            g.fillStyle = "#3a2418";
            g.fill();
            g.fillStyle = "#6a4a38";
            g.beginPath();
            g.ellipse(ex, ey + rad * 0.07, rad * 0.09, rad * 0.07, 0, 0, 7);
            g.fill();
            g.fillStyle = "#fff";
            g.beginPath();
            g.arc(ex - rad * 0.04, ey - rad * 0.06, rad * 0.05, 0, 7);
            g.fill();
            g.beginPath();
            g.arc(ex + rad * 0.045, ey + rad * 0.07, rad * 0.025, 0, 7);
            g.fill();
          }
          // brows
          g.strokeStyle = hs;

        const tone = (f, t0, d, type = "triangle", v = 0.14, f2, dest) => {
          if (!ac) return;
          const o = ac.createOscillator(),
            gn = ac.createGain(),
            t = ac.currentTime + t0;
          o.type = type;
          o.frequency.setValueAtTime(f, t);
          if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
          gn.gain.setValueAtTime(v, t);
          gn.gain.exponentialRampToValueAtTime(0.001, t + d);
          o.connect(gn);

          o.start(t);
          o.stop(t + d + 0.05);

            g.fillStyle = low ? "#fff" : "#3a2a1a"; g.font = "bold 16px Athiti, system-ui"; g.textAlign = "center"; g.textBaseline = "middle";
            g.fillText("เวลา " + tl + " วิ", W - 50, 69);
          }
          // big countdown when the round is about to end
          if (G.freeze <= 0 && G.time > 0 && G.time <= 5) {
            const n = Math.ceil(G.time),
              ph = 1 - (G.time - Math.floor(G.time)),
              sc = 1 + 0.35 * (1 - ph);
            g.save();
            g.translate(W / 2, 300);
            g.scale(sc, sc);
            g.globalAlpha = 0.55 + 0.4 * (1 - ph);
            g.font = "bold 150px Athiti, system-ui";
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.lineJoin = "round";
            g.strokeStyle = "#fff";
            g.lineWidth = 14;
            g.strokeText(n, 0, 0);
            g.fillStyle = "#e8402a";
            g.fillText(n, 0, 0);
            g.restore();
          }
          if (G.freeze > 0) {
            const k = Math.min(1, G.bannerT / 0.35),
              sc = easeOut(k) * (G.freeze < 0.3 ? G.freeze / 0.3 : 1);
            g.save();
            g.translate(W / 2, 250);
            g.scale(sc, sc);
            g.fillStyle = "#fffdf3";
            g.strokeStyle = OUT;
            g.lineWidth = 4;
            g.beginPath();
            g.roundRect(-165, -52, 330, 104, 24);
            g.fill();
            g.stroke();
            g.fillStyle = "#c2521a";
            g.font = "bold 40px Athiti, system-ui";
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.fillText("รอบที่ " + G.round, 0, -14);
            g.fillStyle = "#5b4630";
            g.font = "bold 16px Athiti, system-ui";
            g.fillText(G.round === 1 ? "เสิร์ฟลูกค้าให้ได้มากที่สุด!" : G.round === 2 ? "มีท็อปปิ้งแล้ว!" : "ลูกค้าใหม่! ใจร้อนขึ้น", 0, 26);
            g.restore();
          }
        }
        requestAnimationFrame(loop);
      }
      showTitle();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
